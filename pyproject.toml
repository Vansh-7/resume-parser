[project]
name = "resume-parser"
version = "0.1.0"
description = "An AI-powered extraction pipeline that parses PDF and Word resumes into structured JSON data for automated candidate evaluation."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.140.0",
    "groq>=1.6.0",
    "logging>=0.4.9.6",
    "pymupdf>=1.28.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "tenacity>=9.1.4",
]
